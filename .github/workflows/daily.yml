name: Daily FPE Holdings Snapshot

on:
  schedule:
    - cron: '30 10 * * 1-5'  # 6:30 AM ET (EDT/summer); 5:30 AM in winter (EST)
  workflow_dispatch:          # allow manual runs from GitHub UI

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        run: python fpe_tracker.py --no-browser

      - name: Publish to GitHub Pages
        run: |
          TODAY=$(date +%Y-%m-%d)
          git add data/ docs/index.html
          git diff --cached --quiet || git commit -m "Daily snapshot ${TODAY}"
          git push
