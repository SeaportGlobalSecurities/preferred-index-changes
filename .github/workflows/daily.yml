name: Daily FPE Holdings Snapshot

on:
  schedule:
    - cron: '30 12 * * 1-5'  # 7:30 AM ET (EST); 8:30 AM in summer (EDT)
  workflow_dispatch:          # allow manual runs from GitHub UI

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        run: python fpe_tracker.py --no-browser

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fpe-snapshot-${{ github.run_id }}
          path: data/

      - name: Publish to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TODAY=$(date +%Y-%m-%d)
          PREV=$(date -d "yesterday" +%Y-%m-%d)
          REPORT="data/fpe_report_${PREV}_to_${TODAY}.html"
          mkdir -p docs
          if [ -f "$REPORT" ]; then
            cp "$REPORT" docs/index.html
          fi
          git add "data/fpe_${TODAY}.json" docs/index.html
          git diff --cached --quiet || git commit -m "Daily snapshot ${TODAY}"
          git push
