name: Daily FPE Holdings Snapshot

on:
  schedule:
    - cron: '30 10 * * 1-5'  # 6:30 AM ET (EDT/summer); 5:30 AM in winter (EST)
  workflow_dispatch:          # allow manual runs from GitHub UI

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        run: python fpe_tracker.py --no-browser

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fpe-snapshot-${{ github.run_id }}
          path: data/

      - name: Publish to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TODAY=$(date +%Y-%m-%d)
          git add data/ docs/index.html
          git diff --cached --quiet || git commit -m "Daily snapshot ${TODAY}"
          git push
